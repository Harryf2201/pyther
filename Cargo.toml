[package]
name = "pawnstorm"
version = "2.1.0"
edition = "2021"

[features]
default = ["kb4nm"]
# Unmirrored KB4 input zones; requires the matching 1024-wide merged network.
kb4nm = []
# Diagnostic build: same KB inference/search, rebuild changed king zones from scratch.
kb-refresh-only = ["kb4nm"]

[dependencies]
shakmaty = "0.30.2"
shakmaty-syzygy = "0.28.1"

[workspace]
members = [".", "tools/dashboard", "tools/openings"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
