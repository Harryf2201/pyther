# Self-play training data for Pawnstorm's NNUE, generated on GitHub-hosted runners.
# Start it from the Actions tab ("Run workflow") or locally with tools\cloud-datagen.ps1.
# Each job writes "<fen> | <score> | <result>" lines, the same format as the local generator.
name: datagen

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel jobs (max 20), or auto: 20 when no test match is running or queued, else 14 (6 runners stay free for a test). 6 also means auto (the old default, still passed by older chained runs)."
        default: "auto"
      minutes:
        description: "Minutes of generation per job (keep under ~340: jobs are capped at 6 hours)"
        default: "330"
      soft_nodes:
        description: "Soft node limit per move (local generator uses 5000)"
        default: "5000"
      hard_nodes:
        description: "Hard node limit per move (must be >= soft_nodes)"
        default: "100000"
      source_commit:
        description: "Optional full commit SHA to pin checkout (launcher resolves -Ref)"
        default: ""
      chain:
        description: "Follow-up batches to start automatically after this one (only if every job succeeds)"
        default: "0"
      eval:
        description: "classical = hand-crafted eval (gen1 data); nnue = the network in nets/default.bin (gen2 data)"
        default: "nnue"

# Only one batch at a time; a second request waits for the first to finish.
concurrency:
  group: datagen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_JOBS: ${{ inputs.jobs }}
        run: |
          req="$REQUESTED_JOBS"
          if [ "$req" = "auto" ] || [ "$req" = "6" ]; then
            # The account runs 20 jobs at once; a test match needs 6 of them.
            busy=$(gh run list --repo "${{ github.repository }}" --workflow test-match.yml --limit 30 --json status -q '[.[] | select(.status != "completed")] | length' || echo 1)
            if [ "${busy:-1}" -gt 0 ]; then n=14; else n=20; fi
            echo "auto: ${busy} test run(s) running or queued -> ${n} jobs"
          else
            [[ "$req" =~ ^[0-9]+$ ]] || { echo "invalid jobs"; exit 1; }
            n=$(( req ))
          fi
          if [ "$n" -gt 20 ]; then n=20; fi
          if [ "$n" -lt 1 ]; then n=1; fi
          echo "shards=$(seq -s, 1 "$n" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Build (${{ inputs.eval }} evaluation)
        env:
          EVAL: ${{ inputs.eval }}
        run: |
          set -euo pipefail
          # An empty network file makes the engine use its hand-crafted evaluation.
          case "$EVAL" in
            nnue) test "$(wc -c < nets/default.bin)" -eq 2118208; test "$(cat nets/default.gen)" = 8; sha256sum -c nets/default.sha256 ;;
            classical) : > nets/default.bin ;;
            *) echo "invalid eval"; exit 1 ;;
          esac
          # Sources are vendored from the existing local cache: no registry downloads.
          nice -n 10 cargo --config .cargo/offline.toml build --release --offline --locked -j 6 --manifest-path datagen-build/Cargo.toml
          nice -n 10 ./datagen-build/target/release/pawnstorm perft

      - name: Generate
        env:
          SOFT: ${{ inputs.soft_nodes }}
          HARD: ${{ inputs.hard_nodes }}
          MINUTES: ${{ inputs.minutes }}
          EVAL: ${{ inputs.eval }}
        run: |
          set -euo pipefail
          [[ "$SOFT" =~ ^[0-9]+$ && "$HARD" =~ ^[0-9]+$ && "$MINUTES" =~ ^[0-9]+$ ]]
          (( SOFT > 0 && HARD >= SOFT && MINUTES >= 10 && MINUTES <= 340 ))
          out="data/shard-${{ matrix.shard }}"
          mkdir -p "$out"
          # Distinct seed per job: run id and shard number mixed together.
          seed=$(( (${{ github.run_id }} * 1000 + ${{ matrix.shard }}) % 9007199254740991 ))
          threads=$(nproc); if [ "$threads" -gt 6 ]; then threads=6; fi
          echo "threads: $threads, seed: $seed"
          exe=./datagen-build/target/release/pawnstorm
          gen=$(cat nets/default.gen); [ "$EVAL" = nnue ] || gen=1
          {
            echo "gen=$gen"
            echo "source_tag=gen${gen}o-big7-cloud-n$SOFT"
            echo "commit=$(git rev-parse HEAD)"
            echo "net_sha256=$(sha256sum nets/default.bin | cut -d' ' -f1)"
            echo "exe_sha256=$(sha256sum "$exe" | cut -d' ' -f1)"
            echo "nnue_width=1024"
            echo "eval=$EVAL"
            echo "soft_nodes=$SOFT"
            echo "hard_nodes=$HARD"
            echo "seed=$seed"
            echo "opening_percent=50"
            echo "opening_sha256=$(sha256sum openings/gen7-human.uci | cut -d' ' -f1)"
            echo "deny_sha256=$(sha256sum openings/testbook-starts.fen | cut -d' ' -f1)"
          } > "$out/provenance.txt"
          nice -n 10 "$exe" datagen "$threads" 1000000000000 "$SOFT" "$out" "$(( MINUTES * 60 ))" "$seed" --hard-nodes "$HARD" --openings openings/gen7-human.uci --opening-percent 50 --deny openings/testbook-starts.fen | tr '\r' '\n' | tail -n 3
          cat "$out/provenance.txt" >> "$out/status.txt"
          cat "$out/status.txt"

      - name: Compress
        run: |
          cd "data/shard-${{ matrix.shard }}"
          for f in data_*.txt; do gzip -6 "$f"; done
          { echo "seed_run=${{ github.run_id }}"; echo "shard=${{ matrix.shard }}"; echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"; } >> status.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data/shard-${{ matrix.shard }}/
          compression-level: 0
          retention-days: 7

  # Starts the next batch in a chain. Runs only if every generate job succeeded, so any failure,
  # cancellation or throttling ends the chain. The new run waits in the concurrency queue until
  # this one has fully finished, so batches never overlap. This isolated generation
  # branch uses finite explicit chains only; DATAGEN_FOREVER does not extend them.
  next:
    needs: generate
    if: ${{ success() && inputs.chain != '' && inputs.chain != '0' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SOFT: ${{ inputs.soft_nodes }}
          HARD: ${{ inputs.hard_nodes }}
          MINUTES: ${{ inputs.minutes }}
          EVAL: ${{ inputs.eval }}
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
          REQUESTED_JOBS: ${{ inputs.jobs }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: |
          [[ "$CHAIN" =~ ^[0-3]$ ]] || exit 1
          remaining=$(( CHAIN - 1 ))
          if [ "$remaining" -lt 0 ]; then remaining=0; fi
          echo "starting the next batch ($remaining more after it)"
          gh workflow run datagen.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f jobs="$REQUESTED_JOBS" -f minutes="$MINUTES" -f soft_nodes="$SOFT" -f hard_nodes="$HARD" -f chain="$remaining" -f eval="$EVAL" -f source_commit="$SOURCE_COMMIT"
